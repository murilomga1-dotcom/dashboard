[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leilao-sig"
version = "0.1.0"
description = "Cadastro automático de leilões judiciais no SIG a partir do edital"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.6",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "PySide6>=6.7",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
windows = ["pywin32>=306"]

[project.scripts]
leilao-sig = "leilao_sig.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leilao_sig = ["config/*.json", "prompts/*.md", "sig_scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
